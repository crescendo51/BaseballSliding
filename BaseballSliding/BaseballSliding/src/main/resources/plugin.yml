name: BaseballSliding
version: ${project.version}
main: com.baseballserver.sliding.SlidingPlugin
api-version: '1.21'
author: BaseballServer
description: Shift 연타 슬라이딩

commands:
  슬라이딩설정:
    description: 슬라이딩 설정을 확인하거나 변경합니다
    usage: /슬라이딩설정 [항목] [값]
    aliases: [slideadmin]
    permission: baseballsliding.admin

permissions:
  baseballsliding.admin:
    description: 슬라이딩 설정 변경 권한
    default: op
  baseballsliding.use:
    description: 슬라이딩 사용 권한
    default: true
